[program:auction-reverb]
command=php /var/www/html/artisan reverb:start
process_name=%(program_name)s
; Exactly one process -- this platform has no Redis-backed pub/sub, so there's
; no shared connection state a second reverb:start process could join. Don't
; raise numprocs above 1 unless that infrastructure gets added later.
numprocs=1
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/dot-auction/reverb.log
; reverb:start needs longer than the default 10s to drain existing WebSocket
; connections on shutdown/restart.
stopsignal=TERM
stopwaitsecs=30
