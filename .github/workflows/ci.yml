name: CI

# Runs the test suite on every pull request (whatever its base branch, so stacked
# PRs are covered) and on pushes to the trunk. The suite uses in-memory SQLite
# from phpunit.xml and fakes Vite, so no database or asset build is needed.
on:
  # Called by deploy.yml as the release gate.
  workflow_call: {}
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      # .env must exist BEFORE composer install: package:discover boots the app,
      # and with no .env the broadcaster defaults to reverb with null credentials.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          BROADCAST_CONNECTION: log
        run: ./vendor/bin/phpunit --colors=never

  # The same suite on PostgreSQL, the production database. SQLite let three real defects through (a watchlist insert
  # that PostgreSQL rejects, case-sensitive search, numeric overflow) and cannot show row-lock behaviour at all.
  tests-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dot_auction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: pdo_pgsql, pgsql, sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, gd

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests on PostgreSQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: dot_auction_test
        run: ./vendor/bin/phpunit -c phpunit.pgsql.xml --colors=never
